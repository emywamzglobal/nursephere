            <!-- ==========================================
        EXAMINATION MANAGEMENT
========================================== -->
<main class="dashboard-content">
<section class="page-section">

    <h1>

        Examination Management

    </h1>

    <p>

        Create nursing examinations that students can access from the Practice page.

    </p>

</section>

<!-- ==========================================
        CREATE EXAMINATION
========================================== -->

<section class="form-section">

    <form id="examForm">

        <input
            type="hidden"
            id="examId">

        <div class="form-group">

            <label for="examName">

                Examination Name

            </label>

            <input
                type="text"
                id="examName"
                placeholder="e.g. NCLEX"
                required>

        </div>

        <div class="form-group">

            <label for="examDescription">

                Description

            </label>

            <textarea
                id="examDescription"
                rows="4"
                placeholder="Brief description of this examination..."></textarea>

        </div>

        <div class="form-group">

            <label for="examStatus">

                Status

            </label>

            <select id="examStatus">

                <option value="draft">

                    Draft

                </option>

                <option value="published">

                    Published

                </option>

            </select>

        </div>

        <div class="form-actions">

            <button
                type="button"
                id="saveDraftBtn"
                class="secondary-btn">

                Save Draft

            </button>

            <button
                type="submit"
                id="publishBtn"
                class="primary-btn">

                Publish

            </button>

        </div>

    </form>

</section>

<!-- ==========================================
        EXAMINATIONS
========================================== -->

<section class="table-section">

    <table class="data-table">

        <thead>

            <tr>

                <th>

                    Examination

                </th>

                <th>

                    Status

                </th>

                <th>

                    Actions

                </th>

            </tr>

        </thead>

        <tbody id="examsTableBody">

            <!-- Backend Populates Examination Records -->

        </tbody>

    </table>

</section>
