<!--=========================================
            Nursephere STUDENT HEADER
==========================================-->

<header class="student-header">

    <!-- Left Side -->

    <div class="header-left">

        <!-- Sidebar Toggle -->

        <button class="menu-toggle" id="menuToggle">

            <i class="fas fa-bars"></i>

        </button>

        <!-- Search -->

        <div class="search-box">

            <i class="fas fa-search"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="Search questions, exams or documents...">

        </div>

    </div>

    <!-- Right Side -->

    <div class="header-right">

        <!-- Notifications -->

        <button class="header-icon notification-btn" id="notificationBtn">

            <i class="fas fa-bell"></i>

            <span class="notification-badge" id="notificationCount">

                3

            </span>

        </button>

        <!-- Profile -->

        <div class="profile-dropdown">

            <button
                class="profile-btn"
                id="profileToggle">

                <!-- Avatar -->

                <div class="avatar-wrapper">

                    <img
                        src="../assets/images/avatar-placeholder.png"
                        alt="Student Profile"
                        id="studentAvatar">

                    <input
                        type="file"
                        id="avatarUpload"
                        accept="image/png,image/jpeg,image/jpg"
                        hidden>

                </div>

                <!-- Student Info -->

                <div class="profile-info">

                    <h4 id="studentName">

                        Student Name

                    </h4>

                    <span id="studentPlan">

                        Free Trial

                    </span>

                </div>

                <!-- Arrow -->

                <i class="fas fa-chevron-down"></i>

            </button>

            <!-- Dropdown -->

            <div
                class="profile-menu"
                id="profileMenu">

                <a
                    href="#"
                    id="uploadPhoto">

                    <i class="fas fa-camera"></i>

                    Upload Photo

                </a>

                <a href="profile.html">

                    <i class="fas fa-user"></i>

                    My Profile

                </a>

                <a href="subscription.html">

                    <i class="fas fa-credit-card"></i>

                    Subscription

                </a>

                <a href="settings.html">

                    <i class="fas fa-gear"></i>

                    Settings

                </a>

                <hr>

                <a
                    href="../index.html"
                    id="logoutBtn">

                    <i class="fas fa-right-from-bracket"></i>

                    Logout

                </a>

            </div>

        </div>

    </div>

</header>
